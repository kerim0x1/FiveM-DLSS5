; RenoDX DLSS 5 defaults shipped by FiveM-DLSS5.
; NREnableUpscaling stays 0 so the feeder writes 1:1 into the game frame
; (no 16:9 -> 32:9 compositor stretch on ultrawide monitors).

[RenoDX.DLSS5]
EnableHooks=2
NeuralUplift=5
NREnableUpscaling=0
NRIntensity=1.45
NRLocalStructure=1.35
NRLocalTone=1.35
NRLookColour=1.2
NRLookDetail=1.35
NRLookStrength=1.3
NRLookUpsample=1
NRPasses=2
NRPass2Intensity=1.2
NRPass2Style=2
NRStyle=2
NRUICorrection=1
